services:
  arcade:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/itachi-rdy79/gap-arcade:latest
    container_name: gap-arcade
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 16M
    security_opt:
      - no-new-privileges:true
