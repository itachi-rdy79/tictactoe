<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAP - Arcade Deck</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <main class="container">
    <header class="topbar">
      <h1>GAP</h1>
      <span class="chip" id="modeChip">Mode: Tic-Tac-Toe 3x3 vs Computer</span>
    </header>

    <!-- Game Hub -->
    <section class="hub card">
      <h3>Game Hub</h3>

      <div class="hub-row">
        <small>Game Type</small>
        <div class="pill-group" id="gameTypePills">
          <button class="pill active" data-game="ttt3" type="button">◼︎ 3×3 Tic-Tac-Toe</button>
          <button class="pill" data-game="ttt5" type="button">◻︎ 5×5 Tic-Tac-Toe</button>
          <button class="pill" data-game="chess" type="button">♞ Chess</button>
        </div>
      </div>

      <div class="hub-row">
        <small>Opponent</small>
        <div class="pill-group" id="opponentPills">
          <button class="pill" data-opponent="local" type="button">👥 Local 2P</button>
          <button class="pill active" data-opponent="ai" type="button">🤖 AI</button>
        </div>
      </div>

      <div class="hub-row" id="difficultyRow">
        <small>Difficulty</small>
        <div class="pill-group" id="difficultyPills">
          <button class="pill" data-difficulty="easy" type="button">Easy</button>
          <button class="pill active" data-difficulty="medium" type="button">Medium</button>
          <button class="pill" data-difficulty="hard" type="button">Hard</button>
        </div>
      </div>

      <div class="hub-row">
        <small>Turn Timer</small>
        <div class="pill-group" id="timerPills">
          <button class="pill active" data-timer="off" type="button">Off</button>
          <button class="pill" data-timer="5" type="button">5s</button>
          <button class="pill" data-timer="10" type="button">10s</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard -->
    <section class="card score-card">
      <h3>Scoreboard</h3>
      <div class="score-grid">
        <div>
          <small>You / X / White</small>
          <strong id="scoreA">0</strong>
        </div>
        <div>
          <small>Opponent / O / Black</small>
          <strong id="scoreB">0</strong>
        </div>
        <div>
          <small>Draws</small>
          <strong id="scoreD">0</strong>
        </div>
      </div>
      <div class="streak-row">
        <span id="streakBadge" class="streak-badge">🔥 Streak: 0</span>
      </div>
    </section>

    <!-- Status -->
    <section class="status-row">
      <div id="status">Tic-Tac-Toe: X's turn</div>
      <div id="thinking" class="thinking" style="display:none;">
        <span>AI thinking</span>
        <span class="dots"><i>.</i><i>.</i><i>.</i></span>
      </div>
    </section>

    <!-- Timer -->
    <section class="timer-wrap" id="timerWrap" style="display:none;">
      <div class="timer-bar">
        <div id="timerFill"></div>
      </div>
      <small id="timerLabel">Turn time</small>
    </section>

    <!-- Boards -->
    <section class="board-wrap" id="boardWrap">
      <svg id="tttWinLine" class="ttt-win-line" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>

      <div id="tttBoard" class="ttt-board"></div>
      <div id="chessBoard" class="chess-board" style="display:none;"></div>

      <div id="capturedPanel" class="captured" style="display:none;">
        <div><b>White captured:</b> <span id="whiteCaptured"></span></div>
        <div><b>Black captured:</b> <span id="blackCaptured"></span></div>
      </div>
    </section>

    <!-- Move History -->
    <section class="history card">
      <h3>Move History</h3>
      <div id="historyList" class="history-list"></div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <button id="newGameBtn" type="button">New Game</button>
      <button id="undoBtn" type="button">Undo</button>
      <button id="resetScoreBtn" type="button">Reset Score</button>

      <div class="gselect" id="themeWrap">
        <button class="gselect-btn" type="button">
          <span class="gselect-label">Theme</span>
          <span class="gselect-value" id="themeValueText">🌙 Dark</span>
          <span class="gselect-caret">⌄</span>
        </button>
        <div class="gselect-menu" id="themeMenu"></div>
      </div>

      <!-- Hidden selects kept for compatibility with JS logic -->
      <select id="modeSelect" hidden>
        <option value="ttt3-2p">Tic-Tac-Toe 3x3 (2 Players)</option>
        <option value="ttt3-ai" selected>Tic-Tac-Toe 3x3 vs Computer</option>
        <option value="ttt5-2p">Tic-Tac-Toe 5x5 (2 Players)</option>
        <option value="ttt5-ai">Tic-Tac-Toe 5x5 vs Computer</option>
        <option value="chess-2p">Chess (2 Players)</option>
        <option value="chess-ai">Chess vs Computer</option>
      </select>

      <select id="difficultySelect" hidden>
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>

      <select id="themeSelect" hidden>
        <option value="dark" selected>🌙 Dark</option>
        <option value="light">☀️ Light</option>
        <option value="itachi">🧑‍🎤 Itachi</option>
      </select>
    </section>
  </main>

  <!-- Winner overlay -->
  <div id="winOverlay" class="win-overlay hidden">
    <div class="win-screen">
      <div class="win-banner">
        <h2 id="winMessage" class="win-message">WINNER!</h2>
      </div>
      <button id="winRestartBtn" class="win-restart-btn" type="button">Continue</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
