<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub - Tic Tac Toe & Chess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Game Hub</h1>

    <div class="controls">
      <label for="modeSelect">Mode:</label>
      <select id="modeSelect">
        <option value="ttt2p">Tic-Tac-Toe (2 Players)</option>
        <option value="tttAI">Tic-Tac-Toe vs Computer</option>
        <option value="chess2p">Chess (2 Players)</option>
        <option value="chessAI">Chess vs Computer</option>
      </select>

      <div id="difficultyWrap" class="inline">
        <label for="difficultySelect">Difficulty:</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <button id="resetBtn">Reset</button>
    </div>

    <div id="status">Welcome! Choose a mode and play.</div>
    <div id="aiThinking" class="thinking" style="display:none;">AI thinking...</div>

    <div id="tttBoard" class="ttt-board"></div>
    <div id="chessBoard" class="chess-board" style="display:none;"></div>

    <div id="capturedPanel" class="captured-panel" style="display:none;">
      <div>
        <strong>White captured:</strong>
        <div id="whiteCaptured" class="captured-row"></div>
      </div>
      <div>
        <strong>Black captured:</strong>
        <div id="blackCaptured" class="captured-row"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
