<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="shell">
    <header class="topbar glass">
      <h1>Game Hub</h1>
      <div class="chip" id="modeChip">Mode: Tic-Tac-Toe vs AI</div>
    </header>

    <section class="controls glass">
      <div class="control">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="ttt2p">Tic-Tac-Toe 5x5 (2 Players)</option>
          <option value="tttAI" selected>Tic-Tac-Toe 5x5 vs Computer</option>
        </select>
      </div>

      <div class="control" id="difficultyWrap">
        <label for="difficultySelect">Difficulty</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="control">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <button id="resetBtn" class="btn">New Game</button>
    </section>

    <section class="layout">
      <section class="board-card glass">
        <div class="status-row">
          <div id="status">Tic-Tac-Toe: X's turn</div>
          <div id="aiThinking" class="thinking" style="display:none;">AI thinking...</div>
        </div>
        <div id="tttBoard" class="ttt-board"></div>
      </section>

      <aside class="side">
        <section class="glass card">
          <h3>Scoreboard</h3>
          <div class="score-grid">
            <div class="score-box">
              <span>You (X)</span>
              <strong id="scoreX">0</strong>
            </div>
            <div class="score-box">
              <span>Computer / O</span>
              <strong id="scoreO">0</strong>
            </div>
            <div class="score-box full">
              <span>Draws</span>
              <strong id="scoreD">0</strong>
            </div>
          </div>
        </section>

        <section class="glass card">
          <h3>How to play</h3>
          <ul>
            <li>Board is <b>5x5</b>.</li>
            <li>Connect <b>4 in a row</b> to win.</li>
            <li>Choose Dark/Light theme from the Theme dropdown.</li>
          </ul>
        </section>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
