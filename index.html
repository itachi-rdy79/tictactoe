<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAP — Arcade Gaming Hub</title>
  <!-- Konoha Leaf Glow Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffb703'/%3E%3Cstop offset='50%25' stop-color='%23fb8500'/%3E%3Cstop offset='100%25' stop-color='%23d00000'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='%23050002'/%3E%3Cpath d='M 86 26 L 76 33 C 65 26 44 26 31 43 L 18 68 L 62 68 C 76 68 83 55 80 43 C 77 31 63 25 49 28 C 35 32 30 46 34 58 C 39 68 53 71 64 67 C 72 62 74 51 68 44 C 62 37 51 40 47 48 C 45 54 49 60 55 58 C 59 56 60 52 58 49' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=14.0" />
</head>
<body data-theme="light">
  <!-- Itachi Background Vector Art -->
  <div class="itachi-bg-art" aria-hidden="true">
    <svg class="itachi-moon-svg" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="redMoonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff0033" stop-opacity="1"/>
          <stop offset="50%" stop-color="#cc0029" stop-opacity="0.9"/>
          <stop offset="80%" stop-color="#7a0019" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="deepBloodMist" cx="50%" cy="65%" r="65%">
          <stop offset="0%" stop-color="#990022" stop-opacity="0.45"/>
          <stop offset="60%" stop-color="#4d0011" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="240" r="190" fill="url(#deepBloodMist)"/>
      <circle cx="200" cy="180" r="110" fill="url(#redMoonGlow)"/>
      <circle cx="200" cy="180" r="110" fill="none" stroke="#ff0033" stroke-width="4" opacity="0.9"/>
      <circle cx="200" cy="180" r="64" fill="none" stroke="#120004" stroke-width="6" opacity="0.85"/>
      <g fill="#080002" opacity="0.92">
        <path d="M200 180 C200 120, 240 85, 265 80 C230 115, 222 155, 200 180 Z"/>
        <path d="M200 180 C150 190, 110 230, 95 250 C125 230, 165 220, 200 180 Z" transform="rotate(120 200 180)"/>
        <path d="M200 180 C150 190, 110 230, 95 250 C125 230, 165 220, 200 180 Z" transform="rotate(240 200 180)"/>
      </g>
      <g fill="#020001">
        <path d="M200 120 C192 120 186 126 186 134 C186 142 191 146 193 150 C182 153 175 160 172 170 C169 180 168 200 165 230 C162 260 155 310 150 350 C175 345 225 345 250 350 C245 310 238 260 235 230 C232 200 231 180 228 170 C225 160 218 153 207 150 C209 146 214 142 214 134 C214 126 208 120 200 120 Z"/>
        <circle cx="196" cy="133" r="1.8" fill="#ff0033"/>
        <circle cx="204" cy="133" r="1.8" fill="#ff0033"/>
      </g>
    </svg>
  </div>

  <!-- Top Floating Command Island -->
  <header class="top-hud glass-island">
    <div class="hud-left">
      <div class="brand">GAP</div>
      <div class="seg" id="gameTypePills">
        <button class="seg-btn active" data-game="ttt3" type="button">3x3 TTT <span class="shortcut-badge">1</span></button>
        <button class="seg-btn" data-game="ttt5" type="button">5x5 TTT <span class="shortcut-badge">2</span></button>
        <button class="seg-btn" data-game="chess" type="button">Chess <span class="shortcut-badge">3</span></button>
        <button class="seg-btn" data-game="wordle" type="button">Wordle <span class="shortcut-badge">4</span></button>
      </div>
    </div>

    <div class="hud-center" id="hudCenterGroup">
      <div class="group" id="opponentGroup">
        <span class="group-label">Opponent</span>
        <div class="seg" id="opponentPills">
          <button class="seg-btn" data-opponent="local" type="button">Local 2P</button>
          <button class="seg-btn active" data-opponent="ai" type="button">vs AI</button>
        </div>
      </div>

      <div class="group" id="difficultyGroup">
        <span class="group-label">Difficulty</span>
        <div class="seg" id="difficultyPills">
          <button class="seg-btn" data-difficulty="easy" type="button">Easy</button>
          <button class="seg-btn active" data-difficulty="medium" type="button">Medium</button>
          <button class="seg-btn" data-difficulty="hard" type="button">Hard</button>
        </div>
      </div>
    </div>

    <div class="hud-right">
      <div class="theme-picker" id="themePicker">
        <button class="theme-trigger seg-btn" id="themeTrigger" type="button" aria-expanded="false">
          <span id="themeCurrentIcon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span id="themeCurrentText">Light</span>
        </button>
        <div class="theme-menu glass-panel" id="themeMenu">
          <button class="theme-item active" data-theme="light" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            Light
          </button>
          <button class="theme-item" data-theme="dark" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            Dark
          </button>
          <button class="theme-item" data-theme="itachi" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="5" r="2.5"/><circle cx="5.9" cy="15.5" r="2.5"/><circle cx="18.1" cy="15.5" r="2.5"/></svg>
            Itachi
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Arena Stage -->
  <main class="arena">
    <section class="status-wrap">
      <div class="turn-pill glass-panel" id="statusPill">X's Turn</div>

      <div class="radial-wrap glass-panel hidden" id="radialWrap">
        <svg class="radial" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="50"></circle>
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="radial-text" id="radialText">30</div>
      </div>
    </section>

    <section class="board-area">
      <div class="captured-strip glass-panel hidden" id="capturedTop"><b>White captured:</b> <span id="whiteCaptured"></span></div>

      <!-- Main Board Shell -->
      <section class="board-shell glass-island" id="boardWrap">
        <svg id="tttWinLine" class="ttt-win-line" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="tttBoard" class="ttt-board"></div>
        <div id="chessBoard" class="chess-board hidden"></div>
        
        <!-- Wordle Container -->
        <div id="wordleGame" class="wordle-arena hidden">
          <div id="wordleBoard" class="wordle-board"></div>
          <div id="wordleKeyboard" class="wordle-keyboard"></div>
        </div>
      </section>

      <div class="captured-strip glass-panel hidden" id="capturedBottom"><b>Black captured:</b> <span id="blackCaptured"></span></div>
    </section>
  </main>

  <!-- Bottom Floating Quick-Dock -->
  <footer class="quick-dock glass-island">
    <div class="dock-block" id="timerGroup">
      <span class="dock-label">Timer</span>
      <div class="seg" id="timerPills">
        <button class="seg-btn active" data-timer="off" type="button">Off</button>
        <button class="seg-btn" data-timer="30" type="button">30s</button>
        <button class="seg-btn" data-timer="60" type="button">60s</button>
        <button class="seg-btn" data-timer="90" type="button">90s</button>
      </div>
    </div>

    <div class="dock-block">
      <span class="dock-label">Actions</span>
      <div class="seg">
        <button id="resetScoreBtn" class="seg-btn icon-btn" type="button" title="Reset Score">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <button id="undoBtn" class="seg-btn icon-btn" type="button" title="Undo (Z)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
          <span>Undo</span>
        </button>
        <button id="newGameBtn" class="seg-btn icon-btn" type="button" title="New Game (R)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Game</span>
        </button>
      </div>
    </div>

    <!-- Clickable Score Ticker Opening Statistics Modal -->
    <div class="score-ticker clickable-ticker" id="scoreTickerBtn" title="Click for Detailed Statistics">
      You: <b id="scoreA">0</b> |
      Opponent: <b id="scoreB">0</b> |
      Draws: <b id="scoreD">0</b> |
      <b id="streakBadge">🔥 Streak: 0</b>
      <span class="stats-hint">📊 Stats</span>
    </div>
  </footer>

  <!-- Hidden State Elements -->
  <select id="modeSelect" hidden>
    <option value="ttt3-2p">TTT3 Local</option>
    <option value="ttt3-ai" selected>TTT3 AI</option>
    <option value="ttt5-2p">TTT5 Local</option>
    <option value="ttt5-ai">TTT5 AI</option>
    <option value="chess-2p">Chess Local</option>
    <option value="chess-ai">Chess AI</option>
    <option value="wordle">Wordle</option>
  </select>
  <select id="difficultySelect" hidden>
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>
  <select id="themeSelect" hidden>
    <option value="light" selected>Light</option>
    <option value="dark">Dark</option>
    <option value="itachi">Itachi</option>
  </select>

  <!-- Win Modal Overlay with Confetti Canvas -->
  <div id="winOverlay" class="win-overlay hidden">
    <canvas id="confettiCanvas"></canvas>
    <div class="win-modal glass-island">
      <h2 id="winMessage">Winner</h2>
      <button id="winRestartBtn" class="seg-btn" type="button">Play Again</button>
    </div>
  </div>

  <!-- Detailed Statistics Modal -->
  <div id="statsModal" class="win-overlay hidden">
    <div class="win-modal glass-island stats-box">
      <h2>🏆 Arcade Statistics</h2>
      <div class="stats-grid" id="statsGridContent">
        <!-- Injected via JavaScript -->
      </div>
      <div class="stats-actions">
        <button id="closeStatsBtn" class="seg-btn active" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=14.0"></script>
</body>
</html>
