name: Daily Tollywood Database Sync

on:
  schedule:
    # Runs everyday at 06:00 UTC (11:30 AM IST)
    # To run at 06:00 AM IST instead, use: - cron: '30 0 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Tollywood Sync Script
        run: node scripts/sync-tollywood.js

      - name: Commit and Push Changes If Updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tollywood-movies.json data/daily/
          if git diff --staged --quiet; then
            echo "No changes in Tollywood database or daily stills today."
          else
            git commit -m "chore(data): auto-sync latest Tollywood movies and daily stills [skip ci]"
            git push origin main
            echo "Successfully updated and pushed latest Tollywood database and stills!"
          fi
