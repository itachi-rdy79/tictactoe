<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Winner Screen</title>
  <style>
    :root {
      --teal: #14bdac;
      --white: #ffffff;
      --text-dark: #0f3b36;
      --shadow: 0 8px 24px rgba(20, 189, 172, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      background: #f5f7f8;
      color: var(--text-dark);
    }

    .winner-screen {
      width: min(90vw, 420px);
      text-align: center;
    }

    .winner-banner {
      background: var(--teal);
      color: var(--white);
      border-radius: 12px;
      padding: 22px 16px;
      box-shadow: var(--shadow);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform;
    }

    .winner-text {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(-20px);
    }

    .restart-btn {
      margin-top: 16px;
      border: none;
      background: transparent;
      color: var(--teal);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-10px);
      padding: 6px 10px;
    }

    .restart-btn:hover {
      text-decoration: underline;
    }

    .winner-screen.show .winner-banner {
      transform: scaleX(1);
    }

    .winner-screen.show .winner-text {
      animation: dropFadeIn 0.45s ease-out 0.25s forwards;
    }

    .winner-screen.show .restart-btn {
      animation: dropFadeInSmall 0.4s ease-out 0.4s forwards;
    }

    @keyframes dropFadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dropFadeInSmall {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <section class="winner-screen" id="winnerScreen" aria-live="polite">
    <div class="winner-banner">
      <h2 class="winner-text">WINNER!</h2>
    </div>

    <button class="restart-btn" id="restartBtn" type="button">
      Restart game
    </button>
  </section>

  <script>
    const winnerScreen = document.getElementById("winnerScreen");
    const restartBtn = document.getElementById("restartBtn");

    function showWinnerScreen() {
      winnerScreen.classList.add("show");
    }

    function hideWinnerScreen() {
      winnerScreen.classList.remove("show");
    }

    restartBtn.addEventListener("click", () => {
      hideWinnerScreen();
    });

    setTimeout(showWinnerScreen, 500);
  </script>
</body>
</html>
